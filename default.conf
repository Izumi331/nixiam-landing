server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssi on;

    # Partiels SSI : servis uniquement via <!--#include -->, pas en accès direct
    location ~ ^/(header|footer|calc-widget)\.html$ { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
