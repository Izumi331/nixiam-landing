<!-- ================= HEADER PARTAGÉ (inclus via SSI nginx sur chaque page) ================= -->
<style>
  :root{
    --violet:#4E366A;
    --indigo:#241634;
    --lavande:#EADEF5;
    --mauve:#8E7EC8;
    --ardoise:#48566B;
    --vert-fonce:#0F7A6E;
    --vert:#12A594;
    --menthe:#3ED6C0;
    --corail:#C2413F;
    --blanc:#F7F6FA;
    --gris-clair:#E3E1E9;
    --gris-moyen:#6B6577;
    --gris-fonce:#2E2C36;
  }
  .site-nav{
    background:var(--indigo);
    color:#fff;
    position:sticky; top:0; z-index:50;
  }
  .site-nav-inner{
    max-width:1080px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .site-nav .logo-row{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .site-nav .logo-mark{width:24px; height:17px;}
  .site-nav .logo-word{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    letter-spacing:0.02em; color:#fff;
  }
  .site-nav ul{
    display:flex; align-items:center; gap:28px; list-style:none; margin:0; padding:0;
  }
  .site-nav ul a{
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500;
    color:var(--lavande); text-decoration:none; transition:color .15s ease;
  }
  .site-nav ul a:hover{color:#fff;}
  .site-nav ul a.current{color:var(--menthe); font-weight:600;}
  .site-nav .nav-cta{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    background:var(--vert-fonce); color:#fff; padding:9px 18px; border-radius:7px;
    text-decoration:none; transition:background .15s ease;
  }
  .site-nav .nav-cta:hover{background:var(--vert);}
  .nav-toggle{display:none;}
  @media (max-width:820px){
    .site-nav ul.nav-links{
      display:none; position:absolute; top:64px; left:0; right:0;
      background:var(--indigo); flex-direction:column; align-items:flex-start;
      padding:16px 24px 24px; gap:16px; border-top:1px solid rgba(255,255,255,0.1);
    }
    .site-nav ul.nav-links.open{display:flex;}
    .nav-toggle{
      display:block; background:none; border:none; color:#fff; font-size:22px;
      cursor:pointer; padding:4px 8px;
    }
  }
</style>

<nav class="site-nav" aria-label="Navigation principale">
  <div class="site-nav-inner">
    <a href="/" class="logo-row">
      <svg class="logo-mark" viewBox="0 0 40 28" aria-hidden="true">
        <g fill="#EADEF5">
          <circle cx="4" cy="4" r="1.6"/><circle cx="11" cy="3" r="1.6"/><circle cx="18" cy="4" r="1.6"/><circle cx="25" cy="6" r="1.6"/>
          <circle cx="3" cy="11" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="17" cy="11" r="1.6"/><circle cx="24" cy="13" r="1.6"/>
          <circle cx="4" cy="18" r="1.6"/><circle cx="11" cy="17" r="1.6"/><circle cx="18" cy="18" r="1.6"/><circle cx="25" cy="20" r="1.6"/>
          <circle cx="6" cy="25" r="1.6"/><circle cx="13" cy="24" r="1.6"/><circle cx="20" cy="25" r="1.6"/>
        </g>
      </svg>
      <span class="logo-word">NIXIAM</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Accueil</a></li>
      <li><a href="/offre-essentiel.html">Essentiel</a></li>
      <li><a href="/offre-business.html">Business</a></li>
      <li><a href="/comment-ca-marche.html">Comment ça marche</a></li>
      <li><a href="/tarifs.html">Tarifs</a></li>
      <li><a href="/calculateur.html">Calculateur</a></li>
      <li><a href="/contact.html" class="nav-cta">Contact</a></li>
    </ul>
  </div>
</nav>
<script>
  (function(){
    var btn = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if(!btn || !links) return;
    btn.addEventListener('click', function(){
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
